<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Training Log</title>
<link rel="manifest" href="#"/>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training Log">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#ffffff;--bg2:#f5f5f5;--bg3:#ebebeb;
  --text:#1a1a1a;--text2:#666;--text3:#999;
  --border:#e0e0e0;--border2:#ccc;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-text:#0C447C;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-text:#27500A;
  --amber:#BA7517;--amber-bg:#FAEEDA;--amber-text:#633806;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-text:#791F1F;
  --purple:#534AB7;--purple-bg:#EEEDFE;--purple-text:#3C3489;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-text:#085041;
  --radius:10px;--radius-sm:7px;
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1a1a1a;--bg2:#242424;--bg3:#2e2e2e;
    --text:#f0f0f0;--text2:#aaa;--text3:#666;
    --border:#333;--border2:#444;
    --blue:#378ADD;--blue-bg:#0c2a45;--blue-text:#85B7EB;
    --green:#639922;--green-bg:#1a2e08;--green-text:#97C459;
    --amber:#EF9F27;--amber-bg:#2e1f05;--amber-text:#FAC775;
    --red:#E24B4A;--red-bg:#2e0f0f;--red-text:#F09595;
    --purple:#7F77DD;--purple-bg:#1e1c3a;--purple-text:#AFA9EC;
    --teal:#1D9E75;--teal-bg:#041f16;--teal-text:#5DCAA5;
  }
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh;padding-bottom:80px}
h1{font-size:20px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin:16px 0 8px}

/* Nav */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;padding:10px 4px 8px;text-align:center;background:none;border:none;color:var(--text2);cursor:pointer;font-size:10px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px}
.nav-btn.active{color:var(--blue)}
.nav-btn svg{width:22px;height:22px;stroke-width:1.8}

/* Screens */
.screen{display:none;padding:16px;max-width:480px;margin:0 auto}
.screen.active{display:block}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:8px}

/* Cards */
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.card-flat{background:var(--bg2);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}

/* Stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.stat-card{background:var(--bg2);border-radius:var(--radius-sm);padding:12px;text-align:center}
.stat-num{font-size:22px;font-weight:600;color:var(--text)}
.stat-lbl{font-size:11px;color:var(--text2);margin-top:2px}

/* Weekly targets */
.target-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}
.target-row:last-child{border-bottom:none}
.target-label{flex:1;font-size:14px}
.target-dots{display:flex;gap:5px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--bg3);border:1.5px solid var(--border2)}
.dot.done{background:var(--green);border-color:var(--green)}
.dot.partial{background:var(--amber);border-color:var(--amber)}
.target-count{font-size:12px;color:var(--text2);min-width:32px;text-align:right}

/* Forms */
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:15px;-webkit-appearance:none}
.field textarea{resize:vertical;min-height:70px;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--blue)}
.field-hint{font-size:12px;color:var(--text3);margin-top:3px}
.field-row{display:flex;gap:10px}
.field-row .field{flex:1}

/* Type selector */
.type-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px}
.type-btn{padding:10px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);color:var(--text2);font-size:13px;font-weight:500;cursor:pointer;text-align:center}
.type-btn.active{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-text)}

/* Exercise rows */
.ex-section{margin-bottom:4px}
.ex-row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
.ex-row:last-child{border-bottom:none}
.ex-check{width:20px;height:20px;flex-shrink:0;margin-top:2px;accent-color:var(--blue)}
.ex-body{flex:1}
.ex-name{font-size:14px;font-weight:500}
.ex-target{font-size:12px;color:var(--text3);margin-top:1px}
.ex-inputs{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.ex-input-group{display:flex;flex-direction:column;align-items:center;gap:2px}
.ex-input-group input{width:58px;padding:6px 8px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:13px;text-align:center}
.ex-input-group span{font-size:10px;color:var(--text3)}
.ex-note{font-size:11px;color:var(--amber);margin-top:3px;font-style:italic}

/* Interval rows */
.interval-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.interval-num{font-size:13px;color:var(--text2);min-width:20px}
.interval-row input{flex:1;padding:8px;border:1px solid var(--border2);border-radius:var(--radius-sm);background:var(--bg);color:var(--text);font-size:13px;text-align:center}
.interval-del{background:none;border:none;color:var(--text3);font-size:18px;cursor:pointer;padding:4px}

/* Buttons */
.btn{width:100%;padding:13px;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;border:none;margin-top:8px}
.btn-primary{background:var(--blue);color:#fff}
.btn-primary:active{opacity:0.85}
.btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border2)}
.btn-sm{width:auto;padding:7px 14px;font-size:13px;font-weight:500}

/* History */
.week-header{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;padding:12px 0 6px;border-bottom:1px solid var(--border);margin-bottom:4px}
.entry{padding:10px 0;border-bottom:1px solid var(--border);cursor:pointer}
.entry:last-child{border-bottom:none}
.entry-top{display:flex;align-items:center;gap:8px}
.entry-date{font-size:12px;color:var(--text2)}
.entry-title{font-size:15px;font-weight:500;margin:2px 0}
.entry-detail{font-size:13px;color:var(--text2)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px}
.badge-run{background:var(--green-bg);color:var(--green-text)}
.badge-track{background:var(--blue-bg);color:var(--blue-text)}
.badge-gym{background:var(--purple-bg);color:var(--purple-text)}
.badge-home{background:var(--amber-bg);color:var(--amber-text)}
.badge-pilates{background:var(--teal-bg);color:var(--teal-text)}
.badge-race{background:var(--red-bg);color:var(--red-text)}

/* Injury bars */
.inj-bar-wrap{display:flex;align-items:center;gap:8px;margin-top:4px}
.inj-label{font-size:12px;color:var(--text2);min-width:80px}
.inj-bar{flex:1;height:6px;background:var(--bg3);border-radius:3px;overflow:hidden}
.inj-fill{height:100%;border-radius:3px;background:var(--green)}
.inj-val{font-size:12px;color:var(--text2);min-width:24px;text-align:right}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:20px;font-size:14px;font-weight:500;z-index:200;opacity:0;transition:opacity 0.2s;pointer-events:none}
.toast.show{opacity:1}

/* Detail modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:150;display:none;align-items:flex-end}
.modal-overlay.open{display:flex}
.modal{background:var(--bg);border-radius:var(--radius) var(--radius) 0 0;padding:20px 16px;width:100%;max-height:80vh;overflow-y:auto;padding-bottom:calc(16px + env(safe-area-inset-bottom))}
.modal-handle{width:36px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 16px}

/* Progress ring */
.ring-wrap{display:flex;flex-direction:column;align-items:center;gap:4px}
.ring-label{font-size:11px;color:var(--text2);text-align:center}

/* Discomfort picker */
.discomfort-row{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.disc-btn{flex:1;min-width:28px;padding:8px 2px;border:1.5px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text2);font-size:13px;cursor:pointer;text-align:center}
.disc-btn.selected{border-color:var(--blue);background:var(--blue-bg);color:var(--blue-text);font-weight:600}
.disc-btn.selected[data-v="4"],.disc-btn.selected[data-v="5"],.disc-btn.selected[data-v="6"]{border-color:var(--amber);background:var(--amber-bg);color:var(--amber-text)}
.disc-btn.selected[data-v="7"],.disc-btn.selected[data-v="8"],.disc-btn.selected[data-v="9"],.disc-btn.selected[data-v="10"]{border-color:var(--red);background:var(--red-bg);color:var(--red-text)}
</style>
</head>
<body>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal-content">
    <div class="modal-handle"></div>
    <div id="modal-body"></div>
  </div>
</div>

<!-- SCREEN: DASHBOARD -->
<div class="screen active" id="screen-dashboard">
  <div class="header">
    <h1>Training Log</h1>
    <span id="dash-week" style="font-size:13px;color:var(--text2)"></span>
  </div>

  <h3>This week</h3>
  <div class="card" id="weekly-targets"></div>

  <h3>Overview</h3>
  <div class="stat-grid" id="stat-grid"></div>

  <h3>Injury tracking</h3>
  <div class="card" id="injury-stats"></div>
</div>

<!-- SCREEN: LOG -->
<div class="screen" id="screen-log">
  <div class="header"><h1>Log session</h1></div>

  <div class="type-grid">
    <button class="type-btn active" onclick="setType('run',this)">Easy / Long run</button>
    <button class="type-btn" onclick="setType('track',this)">Track session</button>
    <button class="type-btn" onclick="setType('gym',this)">Gym session</button>
    <button class="type-btn" onclick="setType('home',this)">Home physio</button>
    <button class="type-btn" onclick="setType('pilates',this)">Pilates</button>
    <button class="type-btn" onclick="setType('race',this)">Race</button>
  </div>

  <!-- RUN / RACE form -->
  <div id="form-run">
    <div class="field">
      <label>Date</label>
      <input type="date" id="run-date">
    </div>
    <div id="race-name-field" style="display:none" class="field">
      <label>Race name</label>
      <input type="text" id="race-name" placeholder="e.g. Saucony 10k London">
    </div>
    <div class="field-row">
      <div class="field"><label>Distance (mi)</label><input type="number" id="run-dist" step="0.01" placeholder="4.92"></div>
      <div class="field"><label>Time</label><input type="text" id="run-time" placeholder="50:47"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Avg pace (min/mi)</label><input type="text" id="run-pace" placeholder="10:19"></div>
      <div class="field"><label>Avg HR (bpm)</label><input type="number" id="run-hr" placeholder="131"></div>
    </div>
    <div class="field">
      <label>Left knee discomfort</label>
      <div class="discomfort-row" id="disc-knee"></div>
    </div>
    <div class="field">
      <label>Right hamstring discomfort</label>
      <div class="discomfort-row" id="disc-ham"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="run-notes" placeholder="How did it feel?"></textarea></div>
    <button class="btn btn-primary" onclick="saveRun()">Save</button>
  </div>

  <!-- TRACK form -->
  <div id="form-track" style="display:none">
    <div class="field"><label>Date</label><input type="date" id="track-date"></div>
    <div class="field-row">
      <div class="field"><label>Warmup distance (mi)</label><input type="number" id="track-warmup" step="0.1" placeholder="1.0"></div>
      <div class="field"><label>Cooldown distance (mi)</label><input type="number" id="track-cooldown" step="0.1" placeholder="1.0"></div>
    </div>
    <div class="field">
      <label>Interval distance</label>
      <select id="track-int-dist">
        <option>400m</option><option>800m</option><option>1 mile</option><option>1200m</option><option>200m</option><option>Other</option>
      </select>
    </div>
    <h3>Intervals</h3>
    <div id="interval-list"></div>
    <button class="btn btn-secondary btn-sm" onclick="addInterval()" style="margin-top:0;margin-bottom:12px">+ Add interval</button>
    <div class="field">
      <label>Left knee discomfort</label>
      <div class="discomfort-row" id="disc-track-knee"></div>
    </div>
    <div class="field">
      <label>Right hamstring discomfort</label>
      <div class="discomfort-row" id="disc-track-ham"></div>
    </div>
    <div class="field"><label>Notes</label><textarea id="track-notes" placeholder="Interval targets, how it felt, conditions..."></textarea></div>
    <button class="btn btn-primary" onclick="saveTrack()">Save</button>
  </div>

  <!-- GYM form -->
  <div id="form-gym" style="display:none">
    <div class="field"><label>Date</label><input type="date" id="gym-date"></div>
    <h3>Physio (gym)</h3>
    <div class="card" id="gym-physio-list"></div>
    <h3>EGYM machines</h3>
    <div class="card" id="egym-list"></div>
    <h3>Gym equipment</h3>
    <div class="card" id="reg-gym-list"></div>
    <h3>Block 1 strength</h3>
    <div class="card" id="block1-list"></div>
    <h3>Isometrics</h3>
    <div class="card" id="iso-list"></div>
    <div class="field"><label>Notes</label><textarea id="gym-notes" placeholder="Weight adjustments, how it felt..."></textarea></div>
    <button class="btn btn-primary" onclick="saveGym()">Save</button>
  </div>

  <!-- HOME form -->
  <div id="form-home" style="display:none">
    <div class="field"><label>Date</label><input type="date" id="home-date"></div>
    <h3>Daily stretch</h3>
    <div class="card" id="daily-stretch-list"></div>
    <h3>Physio exercises</h3>
    <div class="card" id="home-physio-list"></div>
    <div class="field"><label>Notes</label><textarea id="home-notes" placeholder="Any tightness or improvements?"></textarea></div>
    <button class="btn btn-primary" onclick="saveHome()">Save</button>
  </div>

  <!-- PILATES form -->
  <div id="form-pilates" style="display:none">
    <div class="field"><label>Date</label><input type="date" id="pilates-date"></div>
    <div class="field"><label>Duration (mins)</label><input type="number" id="pilates-dur" placeholder="60"></div>
    <div class="field"><label>Notes</label><textarea id="pilates-notes" placeholder="How did it feel?"></textarea></div>
    <button class="btn btn-primary" onclick="savePilates()">Save</button>
  </div>
</div>

<!-- SCREEN: HISTORY -->
<div class="screen" id="screen-history">
  <div class="header"><h1>History</h1></div>
  <div id="history-list"></div>
</div>

<!-- SCREEN: STATS -->
<div class="screen" id="screen-stats">
  <div class="header"><h1>Stats</h1></div>
  <div id="stats-content"></div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nav-btn active" onclick="showScreen('dashboard',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    Dashboard
  </button>
  <button class="nav-btn" onclick="showScreen('log',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="12" x2="15" y2="15"/></svg>
    Log
  </button>
  <button class="nav-btn" onclick="showScreen('history',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
    History
  </button>
  <button class="nav-btn" onclick="showScreen('stats',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
    Stats
  </button>
</nav>

<script>
// ─── DATA ───────────────────────────────────────────────────────────
const GYM_PHYSIO = [
  {id:'gp1',name:'SL hamstring bridge on step',target:'3 sets · 8 reps · 30s rest',sets:3,reps:8,hasKg:true},
  {id:'gp2',name:'Rear foot elevated split squat',target:'3 sets · 8 reps · 30s rest',sets:3,reps:8,hasKg:true},
  {id:'gp3',name:'Standing SL knee drive hold',target:'2 sets · 5 reps · 5s hold',sets:2,reps:5,hasKg:false}
];
const EGYM = [
  {id:'eg1',name:'Chest press',sets:3,reps:8,unit:'resistance',default_weight:'36'},
  {id:'eg2',name:'Rotary torso',sets:2,reps:12,unit:'resistance',default_weight:'33'},
  {id:'eg3',name:'Lat pulldown',sets:2,reps:10,unit:'resistance',default_weight:'60'}
];
const REG_GYM = [
  {id:'rg1',name:'Leg extension',sets:3,reps:10,unit:'kg'},
  {id:'rg2',name:'Leg curl',sets:3,reps:10,unit:'kg'}
];
const BLOCK1 = [
  {id:'b1',name:'Goblet squat',target:'3 sets · 8 reps · 3.X.X tempo',sets:3,reps:8},
  {id:'b2',name:'Split stance trap bar ISO pull',target:'3 sets · 20s hold each side',sets:3,reps:1,unit:'hold'},
  {id:'b3',name:'Split squat',target:'3 sets · 8 reps each side',sets:3,reps:8},
  {id:'b4',name:'Reverse lunge',target:'3 sets · 8 reps each side',sets:3,reps:8},
  {id:'b5',name:'Split stance DB RDL',target:'3 sets · 8 reps each side',sets:3,reps:8},
  {id:'b6',name:'Trap bar squat',target:'3 sets · 6 reps',sets:3,reps:6},
  {id:'b7',name:'Trap bar deadlift',target:'3 sets · 6 reps',sets:3,reps:6},
  {id:'b8',name:'DL leg press',target:'3 sets · 8 reps',sets:3,reps:8},
  {id:'b9',name:'Hamstring ISO',target:'3 sets · 20s hold each side',sets:3,reps:1,unit:'hold'},
  {id:'b10',name:'Seated calf raises',target:'3 sets · 12 reps',sets:3,reps:12},
  {id:'b11',name:'Plate press lateral lunge',target:'3 sets · 8 reps each side',sets:3,reps:8}
];
const ISOS = [
  {id:'iso1',name:'SL calf raise ISO push on leg press',target:'3 sets · 5 × 2s pushes',sets:3,reps:5},
  {id:'iso2',name:'Seated calf ISO',target:'3 sets · 6 × 2s pushes',sets:3,reps:6},
  {id:'iso3',name:'Banded ISO runner march',target:'3 sets · 10 reps each',sets:3,reps:10},
  {id:'iso4',name:'Hip ISO march',target:'3 sets · 5 reps each',sets:3,reps:5},
  {id:'iso5',name:'SL prone machine hamstring curl',target:'3 sets · 5 reps each',sets:3,reps:5}
];
const HOME_PHYSIO = [
  {id:'hp1',name:'McConnell squat',target:'10 sets · 3 reps · 30s rest',sets:10,reps:3,note:'Use tightly rolled towel behind knee'},
  {id:'hp2',name:'Table top alternate leg lowering',target:'3 sets · 10 reps · 2s hold',sets:3,reps:10},
  {id:'hp3',name:'Crab walk banded',target:'3 sets · 10 reps · 30s rest',sets:3,reps:10},
  {id:'hp4',name:'SL wall sit',target:'1 set · 5 reps · 20s hold',sets:1,reps:5}
];
const DAILY_STRETCH = [
  {id:'ds1',name:'Quadricep stretch',target:'1 set · 10 reps · 30s hold · daily'}
];

const WEEKLY_TARGETS = [
  {key:'quad',label:'Quad stretch',target:7,unit:'days'},
  {key:'home',label:'Home physio',target:2,unit:'sessions'},
  {key:'gym',label:'Gym session',target:2,unit:'sessions'},
  {key:'run',label:'Runs',target:3,unit:'runs'},
  {key:'pilates',label:'Pilates',target:1,unit:'session'}
];

// ─── STORAGE ─────────────────────────────────────────────────────────
const STORE_KEY = 'tl-entries-v1';
let entries = [];

function loadEntries(){
  try{const d=localStorage.getItem(STORE_KEY);if(d)entries=JSON.parse(d);}catch(e){entries=[];}
}
function saveEntries(){
  try{localStorage.setItem(STORE_KEY,JSON.stringify(entries));}catch(e){}
}

// ─── INIT ─────────────────────────────────────────────────────────────
window.onload = function(){
  loadEntries();
  setTodayDates();
  buildDiscomfortPickers();
  buildGymForms();
  buildHomeForms();
  renderDashboard();
  renderHistory();
  renderStats();
};

function setTodayDates(){
  const t = new Date().toISOString().split('T')[0];
  ['run-date','track-date','gym-date','home-date','pilates-date'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.value=t;
  });
}

function buildDiscomfortPickers(){
  [['disc-knee','run-knee'],['disc-ham','run-ham'],['disc-track-knee','track-knee'],['disc-track-ham','track-ham']].forEach(([containerId, inputId])=>{
    const c=document.getElementById(containerId);
    if(!c)return;
    let html='';
    for(let i=0;i<=10;i++) html+=`<button class="disc-btn${i===0?' selected':''}" data-v="${i}" data-target="${inputId}" onclick="selectDiscomfort(this)">${i}</button>`;
    c.innerHTML=html;
  });
}

function selectDiscomfort(btn){
  const target=btn.dataset.target;
  const container=btn.parentElement;
  container.querySelectorAll('.disc-btn').forEach(b=>b.classList.remove('selected'));
  btn.classList.add('selected');
}

function getDiscomfort(containerId){
  const sel=document.querySelector(`#${containerId} .disc-btn.selected`);
  return sel?parseFloat(sel.dataset.v):0;
}

function buildExerciseList(containerId, exercises, prefix, showKg=true){
  const c=document.getElementById(containerId);
  if(!c)return;
  c.innerHTML=exercises.map(ex=>{
    const unit = ex.unit||'kg';
    const weightLabel = ex.unit==='resistance'?'resistance':'kg';
    const defaultW = ex.default_weight||'';
    return `<div class="ex-row">
      <input type="checkbox" class="ex-check" id="${prefix}-${ex.id}" onchange="toggleExInputs('${prefix}-inputs-${ex.id}',this.checked)">
      <div class="ex-body">
        <div class="ex-name">${ex.name}</div>
        ${ex.target?`<div class="ex-target">${ex.target}</div>`:''}
        ${ex.note?`<div class="ex-note">${ex.note}</div>`:''}
        <div class="ex-inputs" id="${prefix}-inputs-${ex.id}" style="display:none">
          <div class="ex-input-group"><input type="number" id="${prefix}-sets-${ex.id}" placeholder="${ex.sets}" min="1" max="20"><span>sets</span></div>
          <div class="ex-input-group"><input type="number" id="${prefix}-reps-${ex.id}" placeholder="${ex.reps}" min="1" max="100"><span>${unit==='hold'?'reps':'reps'}</span></div>
          ${(showKg&&ex.hasKg!==false)?`<div class="ex-input-group"><input type="number" id="${prefix}-kg-${ex.id}" placeholder="${defaultW||'0'}" min="0" step="0.5"><span>${weightLabel}</span></div>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleExInputs(id, show){
  const el=document.getElementById(id);
  if(el) el.style.display=show?'flex':'none';
}

function buildGymForms(){
  buildExerciseList('gym-physio-list',GYM_PHYSIO,'gp');
  buildExerciseList('egym-list',EGYM,'eg');
  buildExerciseList('reg-gym-list',REG_GYM,'rg');
  buildExerciseList('block1-list',BLOCK1,'b1');
  buildExerciseList('iso-list',ISOS,'iso');
}

function buildHomeForms(){
  buildExerciseList('daily-stretch-list',DAILY_STRETCH,'ds',false);
  buildExerciseList('home-physio-list',HOME_PHYSIO,'hp',false);
}

// ─── INTERVAL MANAGEMENT ─────────────────────────────────────────────
let intervalCount=0;
function addInterval(){
  intervalCount++;
  const list=document.getElementById('interval-list');
  const row=document.createElement('div');
  row.className='interval-row';
  row.id=`int-row-${intervalCount}`;
  const n=intervalCount;
  row.innerHTML=`<span class="interval-num">${n}</span>
    <input type="text" placeholder="pace (e.g. 8:30)" id="int-pace-${n}">
    <input type="text" placeholder="rest (e.g. 90s)" id="int-rest-${n}">
    <button class="interval-del" onclick="document.getElementById('int-row-${n}').remove()">×</button>`;
  list.appendChild(row);
}

// ─── TYPE SWITCHING ───────────────────────────────────────────────────
let currentType='run';
function setType(type, btn){
  currentType=type;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['run','track','gym','home','pilates','race'].forEach(t=>{
    const el=document.getElementById(`form-${t==='race'?'run':t}`);
    if(el) el.style.display='none';
  });
  if(type==='race'){
    document.getElementById('form-run').style.display='block';
    document.getElementById('race-name-field').style.display='block';
  } else {
    document.getElementById(`form-${type}`).style.display='block';
    if(type!=='race') document.getElementById('race-name-field').style.display='none';
  }
}

// ─── COLLECT EXERCISES ────────────────────────────────────────────────
function collectExercises(exercises, prefix){
  const done=[];
  exercises.forEach(ex=>{
    const cb=document.getElementById(`${prefix}-${ex.id}`);
    if(cb&&cb.checked){
      const sets=document.getElementById(`${prefix}-sets-${ex.id}`)?.value||ex.sets;
      const reps=document.getElementById(`${prefix}-reps-${ex.id}`)?.value||ex.reps;
      const kg=document.getElementById(`${prefix}-kg-${ex.id}`)?.value||'';
      done.push({name:ex.name,sets,reps,kg});
    }
  });
  return done;
}

// ─── SAVE FUNCTIONS ───────────────────────────────────────────────────
function saveRun(){
  const isRace=currentType==='race';
  const entry={
    id:Date.now(),
    type:isRace?'race':'run',
    date:document.getElementById('run-date').value,
    raceName:isRace?document.getElementById('race-name').value:'',
    dist:document.getElementById('run-dist').value,
    time:document.getElementById('run-time').value,
    pace:document.getElementById('run-pace').value,
    hr:document.getElementById('run-hr').value,
    knee:getDiscomfort('disc-knee'),
    ham:getDiscomfort('disc-ham'),

  entries.unshift(entry);
  saveEntries();
  showToast('Run saved');
  resetRunForm();
  renderDashboard();
  renderHistory();
  renderStats();
}

function saveTrack(){
  const intervals=[];
  document.querySelectorAll('.interval-row').forEach((row,i)=>{
    const n=i+1;
    const pace=document.getElementById(`int-pace-${row.id.split('-')[2]}`)?.value;

    id:Date.now(),type:'track',

    cooldown:document.getElementById('track-cooldown').value,

    ham:getDiscomfort('disc-track-ham'),
    notes:document.getElementById('track-notes').value
  };
  if(!entry.date){showToast('Please set a date');return;}
  entries.unshift(entry);
  saveEntries();
  showToast('Track session saved');
  document.getElementById('interval-list').innerHTML='';
  intervalCount=0;
  renderDashboard();renderHistory();renderStats();
}

function saveGym(){

// ─── WEEK HELPERS ─────────────────────────────────────────────────────
function getMondayOf(dateStr){
  const d=new Date(dateStr+'T12:00:00');
  const day=d.getDay();
  const diff=d.getDate()-day+(day===0?-6:1);
  return new Date(d.setDate(diff));
}
function weekKey(dateStr){
  const m=getMondayOf(dateStr);
  return m.toISOString().split('T')[0];
}
function weekLabel(dateStr){
  const m=getMondayOf(dateStr);
  return 'w/c '+m.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function currentWeekKey(){
  return weekKey(new Date().toISOString().split('T')[0]);
}

// ─── DASHBOARD ────────────────────────────────────────────────────────
function renderDashboard(){
  const wk=currentWeekKey();
  const weekEntries=entries.filter(e=>weekKey(e.date)===wk);
  document.getElementById('dash-week').textContent=weekLabel(new Date().toISOString().split('T')[0]);

  const counts={
    quad:weekEntries.filter(e=>e.type==='home'&&e.dailyStretch?.length).length +
         weekEntries.filter(e=>e.type==='gym').length,
    home:weekEntries.filter(e=>e.type==='home').length,
    gym:weekEntries.filter(e=>e.type==='gym').length,
    run:weekEntries.filter(e=>e.type==='run'||e.type==='track'||e.type==='race').length,
    pilates:weekEntries.filter(e=>e.type==='pilates').length
  };

  const wt=document.getElementById('weekly-targets');
  wt.innerHTML=WEEKLY_TARGETS.map(t=>{
    const done=Math.min(counts[t.key]||0,t.target);
    const dots=Array.from({length:t.target},(_,i)=>`<div class="dot${i<done?' done':''}"></div>`).join('');
    return `<div class="target-row">
      <span class="target-label">${t.label}</span>
      <div class="target-dots">${dots}</div>
      <span class="target-count">${done}/${t.target}</span>
    </div>`;
  }).join('');

  const allRuns=entries.filter(e=>e.type==='run'||e.type==='race');
  const totalMi=allRuns.reduce((a,e)=>a+(parseFloat(e.dist)||0),0);
  const allGyms=entries.filter(e=>e.type==='gym');
  const weekMi=weekEntries.filter(e=>e.type==='run'||e.type==='race').reduce((a,e)=>a+(parseFloat(e.dist)||0),0);

  document.getElementById('stat-grid').innerHTML=`
    <div class="stat-card"><div class="stat-num">${totalMi.toFixed(1)}</div><div class="stat-lbl">Total miles</div></div>
    <div class="stat-card"><div class="stat-num">${weekMi.toFixed(1)}</div><div class="stat-lbl">Miles this week</div></div>
    <div class="stat-card"><div class="stat-num">${allRuns.length}</div><div class="stat-lbl">Runs logged</div></div>
    <div class="stat-card"><div class="stat-num">${allGyms.length}</div><div class="stat-lbl">Gym sessions</div></div>`;

  const injRuns=entries.filter(e=>(e.type==='run'||e.type==='track'||e.type==='race')&&(e.knee>0||e.ham>0));
  const inj=document.getElementById('injury-stats');
  if(!injRuns.length){
    inj.innerHTML='<div style="color:var(--text2);font-size:14px">No discomfort logged yet.</div>';
    return;
  }
  const avgKnee=(injRuns.reduce((a,e)=>a+(e.knee||0),0)/injRuns.length).toFixed(1);
  const avgHam=(injRuns.reduce((a,e)=>a+(e.ham||0),0)/injRuns.length).toFixed(1);
  const lastKnee=injRuns[0]?.knee||0;
  const lastHam=injRuns[0]?.ham||0;
  inj.innerHTML=`
    <div class="inj-bar-wrap"><span class="inj-label">Left knee</span><div class="inj-bar"><div class="inj-fill" style="width:${lastKnee*10}%;background:${lastKnee>=4?'var(--red)':lastKnee>=2?'var(--amber)':'var(--green)'}"></div></div><span class="inj-val">${lastKnee}/10</span></div>
    <div style="font-size:11px;color:var(--text3);margin-bottom:8px;padding-left:88px">last run · avg ${avgKnee}</div>
    <div class="inj-bar-wrap"><span class="inj-label">R. hamstring</span><div class="inj-bar"><div class="inj-fill" style="width:${lastHam*10}%;background:${lastHam>=4?'var(--red)':lastHam>=2?'var(--amber)':'var(--green)'}"></div></div><span class="inj-val">${lastHam}/10</span></div>
    <div style="font-size:11px;color:var(--text3);padding-left:88px">last run · avg ${avgHam}</div>`;
}

// ─── HISTORY ──────────────────────────────────────────────────────────
function renderHistory(){
  const c=document.getElementById('history-list');
  if(!entries.length){c.innerHTML='<div style="color:var(--text2);text-align:center;padding:40px 0;font-size:14px">No sessions yet.</div>';return;}
  const grouped={};
  entries.forEach(e=>{
    const wk=weekLabel(e.date);
    if(!grouped[wk])grouped[wk]=[];
    grouped[wk].push(e);
  });
  c.innerHTML=Object.keys(grouped).map(wk=>`
    <div class="week-header">${wk}</div>
    <div class="card">
      ${grouped[wk].map(e=>entryRowHTML(e)).join('')}
    </div>`).join('');
}

function entryRowHTML(e){
  const d=new Date(e.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
  let title='',detail='',badge='';
  if(e.type==='run'){
    badge='<span class="badge badge-run">run</span>';
    title=`${e.dist||'—'}mi`;
    detail=[e.pace&&`${e.pace}/mi`,e.hr&&`${e.hr}bpm`].filter(Boolean).join(' · ');
  } else if(e.type==='race'){
    badge='<span class="badge badge-race">race</span>';
    title=e.raceName||'Race';
    detail=[e.dist&&`${e.dist}mi`,e.time,e.pace&&`${e.pace}/mi`].filter(Boolean).join(' · ');
  } else if(e.type==='track'){
    badge='<span class="badge badge-track">track</span>';
    title=`${e.intervals?.length||0} × ${e.intDist||'intervals'}`;
    detail=e.intervals?.slice(0,3).map(i=>`${i.pace}`).join(', ')||'';
  } else if(e.type==='gym'){
    badge='<span class="badge badge-gym">gym</span>';
    const total=(e.physio?.length||0)+(e.egym?.length||0)+(e.regGym?.length||0)+(e.block1?.length||0)+(e.isos?.length||0);
    title=`${total} exercises`;
    const wts=[...e.block1||[],...e.egym||[],...e.regGym||[]].filter(x=>x.kg).map(x=>`${x.name.split(' ')[0]} ${x.kg}${e.egym?.find(eg=>eg.name===x.name)?'r':'kg'}`).slice(0,3).join(', ');
    detail=wts||'';
  } else if(e.type==='home'){
    badge='<span class="badge badge-home">home</span>';
    title=`${(e.physio?.length||0)+(e.dailyStretch?.length||0)} exercises`;
    detail='';
  } else if(e.type==='pilates'){
    badge='<span class="badge badge-pilates">pilates</span>';
    title=`${e.duration||'—'} mins`;
    detail='';
  }
  return `<div class="entry" onclick="showEntryDetail(${e.id})">
    <div class="entry-top"><span class="entry-date">${d}</span>${badge}</div>
    <div class="entry-title">${title}</div>
    ${detail?`<div class="entry-detail">${detail}</div>`:''}
    ${e.notes?`<div class="entry-detail" style="font-style:italic;margin-top:2px">${e.notes}</div>`:''}
  </div>`;
}

function showEntryDetail(id){
  const e=entries.find(x=>x.id===id);
  if(!e)return;
  const d=new Date(e.date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  let html=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <h2>${d}</h2>
    <button onclick="deleteEntry(${id})" style="background:none;border:none;color:var(--red);font-size:14px;cursor:pointer">Delete</button>
  </div>`;

  if(e.type==='run'||e.type==='race'){
    if(e.raceName) html+=`<p style="font-size:16px;font-weight:600;margin-bottom:8px">${e.raceName}</p>`;
    html+=`<div class="stat-grid">
      <div class="stat-card"><div class="stat-num">${e.dist||'—'}</div><div class="stat-lbl">miles</div></div>
      <div class="stat-card"><div class="stat-num">${e.time||'—'}</div><div class="stat-lbl">time</div></div>
      <div class="stat-card"><div class="stat-num">${e.pace||'—'}</div><div class="stat-lbl">min/mi</div></div>
      <div class="stat-card"><div class="stat-num">${e.hr||'—'}</div><div class="stat-lbl">avg HR</div></div>
    </div>`;
    html+=`<div class="card-flat">
      <div class="inj-bar-wrap"><span class="inj-label">Left knee</span><div class="inj-bar"><div class="inj-fill" style="width:${(e.knee||0)*10}%"></div></div><span class="inj-val">${e.knee||0}/10</span></div>
      <div class="inj-bar-wrap" style="margin-top:8px"><span class="inj-label">R. hamstring</span><div class="inj-bar"><div class="inj-fill" style="width:${(e.ham||0)*10}%"></div></div><span class="inj-val">${e.ham||0}/10</span></div>
    </div>`;
  } else if(e.type==='track'){
    html+=`<p style="margin-bottom:12px;color:var(--text2)">${e.intervals?.length||0} × ${e.intDist}</p>`;
    if(e.intervals?.length){
      html+=`<div class="card-flat">`;
      e.intervals.forEach(i=>{html+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:14px"><span>Rep ${i.n}</span><span>${i.pace||'—'}</span><span style="color:var(--text2)">rest: ${i.rest||'—'}</span></div>`;});
      html+=`</div>`;
    }
    html+=`<div class="card-flat" style="margin-top:8px">
      <div class="inj-bar-wrap"><span class="inj-label">Left knee</span><div class="inj-bar"><div class="inj-fill" style="width:${(e.knee||0)*10}%"></div></div><span class="inj-val">${e.knee||0}/10</span></div>
      <div class="inj-bar-wrap" style="margin-top:8px"><span class="inj-label">R. hamstring</span><div class="inj-bar"><div class="inj-fill" style="width:${(e.ham||0)*10}%"></div></div><span class="inj-val">${e.ham||0}/10</span></div>
    </div>`;
  } else if(e.type==='gym'){
    const allEx=[...(e.physio||[]).map(x=>({...x,cat:'Physio'})),...(e.egym||[]).map(x=>({...x,cat:'EGYM',unit:'r'})),...(e.regGym||[]).map(x=>({...x,cat:'Equipment'})),...(e.block1||[]).map(x=>({...x,cat:'Block 1'})),...(e.isos||[]).map(x=>({...x,cat:'Isometrics'}))];
    if(allEx.length){
      html+=`<div class="card-flat">`;
      allEx.forEach(ex=>{
        const wt=ex.kg?` · ${ex.kg}${ex.unit==='r'?'r':'kg'}`:'';
        html+=`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px"><span style="color:var(--text2);font-size:11px">${ex.cat}</span><br>${ex.name}<span style="color:var(--text2)"> · ${ex.sets}×${ex.reps}${wt}</span></div>`;
      });
      html+=`</div>`;
    }
  } else if(e.type==='home'){
    const allEx=[...(e.dailyStretch||[]).map(x=>({...x,cat:'Daily'})),...(e.physio||[]).map(x=>({...x,cat:'Physio'}))];
    if(allEx.length){
      html+=`<div class="card-flat">`;
      allEx.forEach(ex=>{html+=`<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:14px">${ex.name}</div>`;});
      html+=`</div>`;
    }
  } else if(e.type==='pilates'){
    html+=`<div class="stat-card" style="margin-bottom:12px"><div class="stat-num">${e.duration||'—'}</div><div class="stat-lbl">minutes</div></div>`;
  }
  if(e.notes) html+=`<div class="card-flat" style="font-size:14px;font-style:italic;color:var(--text2)">${e.notes}</div>`;
  document.getElementById('modal-body').innerHTML=html;
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal(evt){
  if(evt.target===document.getElementById('modal-overlay')) document.getElementById('modal-overlay').classList.remove('open');
}

function deleteEntry(id){
  if(!confirm('Delete this entry?'))return;
  entries=entries.filter(e=>e.id!==id);
  saveEntries();
  document.getElementById('modal-overlay').classList.remove('open');
  renderHistory();renderDashboard();renderStats();
}

// ─── STATS ────────────────────────────────────────────────────────────
function renderStats(){
  const runs=entries.filter(e=>e.type==='run'||e.type==='race');
  const tracks=entries.filter(e=>e.type==='track');
  const gyms=entries.filter(e=>e.type==='gym');
  const totalMi=runs.reduce((a,e)=>a+(parseFloat(e.dist)||0),0);
  const injRuns=[...runs,...tracks].filter(e=>e.knee>0||e.ham>0);
  const avgKnee=injRuns.length?(injRuns.reduce((a,e)=>a+(e.knee||0),0)/injRuns.length).toFixed(1):'—';
  const avgHam=injRuns.length?(injRuns.reduce((a,e)=>a+(e.ham||0),0)/injRuns.length).toFixed(1):'—';

  const weightLog=gyms.flatMap(e=>[...(e.block1||[]),...(e.egym||[]),...(e.regGym||[])]).filter(e=>e.kg);
  const byEx={};
  weightLog.forEach(e=>{if(!byEx[e.name])byEx[e.name]=[];byEx[e.name].push(parseFloat(e.kg));});

  let html=`<div class="stat-grid">
    <div class="stat-card"><div class="stat-num">${totalMi.toFixed(1)}</div><div class="stat-lbl">Total miles</div></div>
    <div class="stat-card"><div class="stat-num">${runs.length+tracks.length}</div><div class="stat-lbl">Total runs</div></div>
    <div class="stat-card"><div class="stat-num">${gyms.length}</div><div class="stat-lbl">Gym sessions</div></div>
    <div class="stat-card"><div class="stat-num">${entries.filter(e=>e.type==='pilates').length}</div><div class="stat-lbl">Pilates</div></div>
  </div>`;

  html+=`<h3>Injury trend</h3><div class="card">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px"><span>Left knee avg</span><span style="font-weight:600">${avgKnee}/10</span></div>
    <div style="display:flex;justify-content:space-between;font-size:13px"><span>Right hamstring avg</span><span style="font-weight:600">${avgHam}/10</span></div>
    <div style="font-size:11px;color:var(--text3);margin-top:8px">across ${injRuns.length} sessions with discomfort logged</div>
  </div>`;

  if(Object.keys(byEx).length){
    html+=`<h3>Weights progress</h3><div class="card">`;
    Object.entries(byEx).forEach(([name,kgs])=>{
      const max=Math.max(...kgs);
      const last=kgs[kgs.length-1];
      html+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px">
        <span>${name}</span><span style="color:var(--text2)">last: <strong style="color:var(--text)">${last}</strong> · max: ${max}</span>
      </div>`;
    });
    html+=`</div>`;
  }

  document.getElementById('stats-content').innerHTML=html;
}

// ─── NAVIGATION ───────────────────────────────────────────────────────
function showScreen(name, btn){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='history')renderHistory();
  if(name==='stats')renderStats();
  if(name==='dashboard')renderDashboard();
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}
</script>
</body>
</html>
